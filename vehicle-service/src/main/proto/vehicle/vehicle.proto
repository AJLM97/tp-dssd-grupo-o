syntax = "proto3";

package vehicle;

option java_multiple_files = true;
option java_package = "com.rentar.vehicleservice.grpc";
option java_outer_classname = "VehicleProto";

// Gestión y consulta de vehículos.
service VehicleService {
  // Registra un vehículo; la patente debe ser única y el precio positivo.
  rpc CreateVehicle (CreateVehicleRequest) returns (CreateVehicleResponse);
  // Actualiza los datos del vehículo, excepto patente, estado y activo.
  rpc UpdateVehicle (UpdateVehicleRequest) returns (UpdateVehicleResponse);
  // Desactiva el vehículo sin borrar su registro.
  rpc DeleteVehicle (DeleteVehicleRequest) returns (DeleteVehicleResponse);
  // Lista vehículos y permite excluir los inactivos.
  rpc GetVehicles (GetVehiclesRequest) returns (GetVehiclesResponse);
  // Busca un vehículo por ID.
  rpc GetVehicleById (GetVehicleByIdRequest) returns (GetVehicleByIdResponse);
  // Comprueba existencia y estado activo, no conflictos con reservas.
  rpc CheckAvailability (CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  // Cambia el estado operativo del vehículo.
  rpc UpdateVehicleStatus (UpdateVehicleStatusRequest) returns (UpdateVehicleStatusResponse);
  // Registra la solicitud de un cliente para sumar su vehículo; queda PENDIENTE hasta que terminan las validaciones.
  rpc RegisterExternalVehicle (RegisterExternalVehicleRequest) returns (RegisterExternalVehicleResponse);
  // Lista las solicitudes de vehículos externos de un cliente.
  rpc GetExternalVehicles (GetExternalVehiclesRequest) returns (GetExternalVehiclesResponse);
}

// Tipo de vehículo.
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_SEDAN = 1;
  VEHICLE_TYPE_SUV = 2;
  VEHICLE_TYPE_PICKUP = 3;
  VEHICLE_TYPE_COUPE = 4;
  VEHICLE_TYPE_HATCHBACK = 5;
}

// Estado operativo, independiente del indicador activo.
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_DISPONIBLE = 1;
  VEHICLE_STATUS_RESERVADO = 2;
  VEHICLE_STATUS_EN_ALQUILER = 3;
}

// Resultado de la verificación policial, independiente del estado operativo.
enum VehicleVerification {
  VEHICLE_VERIFICATION_UNSPECIFIED = 0;
  VEHICLE_VERIFICATION_PENDIENTE = 1;
  VEHICLE_VERIFICATION_VALIDADO = 2;
  VEHICLE_VERIFICATION_ROBADO = 3;
}

// Estado de la solicitud de un vehículo externo.
enum ExternalVehicleStatus {
  EXTERNAL_VEHICLE_STATUS_UNSPECIFIED = 0;
  EXTERNAL_VEHICLE_STATUS_PENDIENTE = 1;
  EXTERNAL_VEHICLE_STATUS_INCORPORADO = 2;
  EXTERNAL_VEHICLE_STATUS_RECHAZADO = 3;
}

// Resultado de cada validación de un vehículo externo.
enum ExternalValidationResult {
  EXTERNAL_VALIDATION_RESULT_UNSPECIFIED = 0;
  EXTERNAL_VALIDATION_RESULT_VALIDADO = 1;
  EXTERNAL_VALIDATION_RESULT_RECHAZADO = 2;
}

// Datos del vehículo.
message VehicleData {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  // Color; vacío si no se informó.
  string color = 6;
  VehicleType tipo = 7;
  // Precio diario.
  double precio_diario = 8;
  VehicleStatus estado = 9;
  // false indica baja lógica.
  bool activo = 10;
  // UNSPECIFIED en los vehículos anteriores al Hito 3.
  VehicleVerification verificacion = 11;
}

// Solicitud de un cliente para sumar su vehículo.
message ExternalVehicleData {
  int64 id = 1;
  int64 cliente_id = 2;
  string patente = 3;
  string marca = 4;
  string modelo = 5;
  int32 anio = 6;
  // Color; vacío si no se informó.
  string color = 7;
  VehicleType tipo = 8;
  // Precio diario.
  double precio_diario = 9;
  ExternalVehicleStatus estado = 10;
  // UNSPECIFIED mientras no llega el resultado.
  ExternalValidationResult resultado_patente = 11;
  // UNSPECIFIED mientras no llega el resultado.
  ExternalValidationResult resultado_titularidad = 12;
  // Vehículo creado al incorporarse; 0 mientras no se incorpora.
  int64 vehicle_id = 13;
}

// Datos para registrar un vehículo.
message CreateVehicleRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  // Año, mayor que cero.
  int32 anio = 4;
  string color = 5;
  // Tipo; no puede ser UNSPECIFIED.
  VehicleType tipo = 6;
  // Precio diario, mayor que cero.
  double precio_diario = 7;
}

// Datos para actualizar un vehículo existente.
message UpdateVehicleRequest {
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  // Año, mayor que cero.
  int32 anio = 4;
  // Color; vacío elimina el valor actual.
  string color = 5;
  // Tipo; no puede ser UNSPECIFIED.
  VehicleType tipo = 6;
  // Precio diario, mayor que cero.
  double precio_diario = 7;
}

// Vehículo que se desactivará.
message DeleteVehicleRequest {
  int64 id = 1;
}

// Filtro de vehículos.
message GetVehiclesRequest {
  // true devuelve solo vehículos activos.
  bool solo_activos = 1;
}

// Vehículos encontrados.
message GetVehiclesResponse {
  // Puede estar vacío.
  repeated VehicleData vehicles = 1;
}

// Vehículo que se consultará.
message GetVehicleByIdRequest {
  int64 id = 1;
}

// Fechas para consultar disponibilidad básica.
message CheckAvailabilityRequest {
  int64 vehicle_id = 1;
  // Inicio local, formato AAAA-MM-DDTHH:mm:ss; no se usa para comprobar reservas.
  string fecha_inicio = 2;
  // Fin local, mismo formato; no se usa para comprobar reservas.
  string fecha_fin = 3;
}

// disponible solo indica que el vehículo existe y está activo.
message CheckAvailabilityResponse {
  bool disponible = 1;
  string mensaje = 2;
}

// Cambio de estado operativo.
message UpdateVehicleStatusRequest {
  int64 id = 1;
  // Nuevo estado; no puede ser UNSPECIFIED.
  VehicleStatus nuevo_estado = 2;
}

// Datos del vehículo que un cliente quiere sumar.
message RegisterExternalVehicleRequest {
  // Cliente que lo registra; el gateway lo toma del token.
  int64 cliente_id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  // Año, mayor que cero.
  int32 anio = 5;
  string color = 6;
  // Tipo; no puede ser UNSPECIFIED.
  VehicleType tipo = 7;
  // Precio diario, mayor que cero.
  double precio_diario = 8;
}

// Cliente cuyas solicitudes se consultarán.
message GetExternalVehiclesRequest {
  int64 cliente_id = 1;
}

// Vehículo creado.
message CreateVehicleResponse {
  // Estado inicial: activo y DISPONIBLE.
  VehicleData vehicle = 1;
}

// Vehículo actualizado.
message UpdateVehicleResponse {
  VehicleData vehicle = 1;
}

// Vehículo desactivado.
message DeleteVehicleResponse {
  VehicleData vehicle = 1;
}

// Vehículo encontrado.
message GetVehicleByIdResponse {
  VehicleData vehicle = 1;
}

// Vehículo con el estado actualizado.
message UpdateVehicleStatusResponse {
  VehicleData vehicle = 1;
}

// Solicitud registrada.
message RegisterExternalVehicleResponse {
  // Estado inicial: PENDIENTE.
  ExternalVehicleData external_vehicle = 1;
}

// Solicitudes encontradas.
message GetExternalVehiclesResponse {
  // Puede estar vacío.
  repeated ExternalVehicleData external_vehicles = 1;
}