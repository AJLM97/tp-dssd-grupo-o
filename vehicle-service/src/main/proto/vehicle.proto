syntax = "proto3";

package vehicle;

option java_multiple_files = true;
option java_package = "com.rentar.vehicleservice.grpc";
option java_outer_classname = "VehicleProto";

service VehicleService {
  rpc CreateVehicle (CreateVehicleRequest) returns (VehicleResponse);
  rpc UpdateVehicle (UpdateVehicleRequest) returns (VehicleResponse);
  rpc DeleteVehicle (DeleteVehicleRequest) returns (VehicleResponse);
  rpc GetVehicles (GetVehiclesRequest) returns (GetVehiclesResponse);
  rpc GetVehicleById (GetVehicleByIdRequest) returns (VehicleResponse);
  rpc CheckAvailability (CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc UpdateVehicleStatus (UpdateVehicleStatusRequest) returns (VehicleResponse);
}

enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  SEDAN = 1;
  SUV = 2;
  PICKUP = 3;
  COUPE = 4;
  HATCHBACK = 5;
}

enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  DISPONIBLE = 1;
  RESERVADO = 2;
  EN_ALQUILER = 3;
}

message VehicleResponse {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  VehicleType tipo = 7;
  double precio_diario = 8;
  VehicleStatus estado = 9;
  bool activo = 10;
}

message CreateVehicleRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo = 6;
  double precio_diario = 7;
}

message UpdateVehicleRequest {
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo = 6;
  double precio_diario = 7;
}

message DeleteVehicleRequest {
  int64 id = 1;
}

message GetVehiclesRequest {
  bool solo_activos = 1;
}

message GetVehiclesResponse {
  repeated VehicleResponse vehicles = 1;
}

message GetVehicleByIdRequest {
  int64 id = 1;
}

message CheckAvailabilityRequest {
  int64 vehicle_id = 1;
  string fecha_inicio = 2;
  string fecha_fin = 3;
}

message CheckAvailabilityResponse {
  bool disponible = 1;
  string mensaje = 2;
}

message UpdateVehicleStatusRequest {
  int64 id = 1;
  VehicleStatus nuevo_estado = 2;
}