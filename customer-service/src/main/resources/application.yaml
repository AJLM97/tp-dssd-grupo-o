server:
  port: 8082

grpc:
  server:
    port: 9092

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://localhost:3310/customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect