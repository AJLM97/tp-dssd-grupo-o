syntax = "proto3";

package customer;

option java_multiple_files = true;
option java_package = "com.rentar.customerservice.grpc";
option java_outer_classname = "CustomerProto";

// Gestión y autenticación de clientes.
service CustomerService {
  // Crea un cliente activo (documento y email únicos).
  rpc CreateCustomer (CreateCustomerRequest) returns (CreateCustomerResponse);
  // Actualiza los datos del cliente (no cambia documento, rol ni estado).
  rpc UpdateCustomer (UpdateCustomerRequest) returns (UpdateCustomerResponse);
  // Desactiva el cliente sin borrar su registro (baja lógica).
  rpc DeleteCustomer (DeleteCustomerRequest) returns (DeleteCustomerResponse);
  // Lista clientes (permite excluir los inactivos).
  rpc GetCustomers (GetCustomersRequest) returns (GetCustomersResponse);
  // Busca un cliente por ID.
  rpc GetCustomerById (GetCustomerByIdRequest) returns (GetCustomerByIdResponse);
  // Comprueba si existe y está activo.
  rpc ValidateCustomer (ValidateCustomerRequest) returns (ValidateCustomerResponse);
  // Autentica un cliente activo (email y contraseña).
  rpc AuthenticateCustomer (AuthenticateCustomerRequest) returns (AuthenticateCustomerResponse);
}

// Rol del cliente (las altas asignan ROLE_CLIENTE).
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CLIENTE = 1;
  ROLE_ADMINISTRADOR = 2;
}

// Datos del cliente (no incluye la contraseña).
message CustomerData {
  int64 id = 1;
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  // Email en minúsculas.
  string email = 5;
  string telefono = 6;
  // Fecha AAAA-MM-DD (vacía si no se informó).
  string fecha_nacimiento = 7;
  bool activo = 8;
  Role rol = 9;
}

// Datos para crear un cliente.
message CreateCustomerRequest {
  string documento = 1;
  string nombre = 2;
  string apellido = 3;
  // Email válido y único (se guarda en minúsculas).
  string email = 4;
  // Máximo 72 bytes UTF-8 (se almacena como hash).
  string password = 5;
  string telefono = 6;
  // Fecha opcional AAAA-MM-DD (no puede ser futura).
  string fecha_nacimiento = 7;
}

// Datos editables (no permite cambiar documento, rol ni estado).
message UpdateCustomerRequest {
  int64 id = 1;
  string nombre = 2;
  string apellido = 3;
  // Email válido y único.
  string email = 4;
  string telefono = 5;
  // Fecha opcional AAAA-MM-DD (no puede ser futura).
  string fecha_nacimiento = 6;
}

// Cliente que se desactivará.
message DeleteCustomerRequest {
  int64 id = 1;
}

// Filtro de clientes.
message GetCustomersRequest {
  // true devuelve solo clientes activos.
  bool solo_activos = 1;
}

// Clientes encontrados.
message GetCustomersResponse {
  repeated CustomerData customers = 1;
}

// Cliente que se consultará.
message GetCustomerByIdRequest {
  int64 id = 1;
}

// Cliente que se validará.
message ValidateCustomerRequest {
  int64 id = 1;
}

// Resultado de validar el cliente.
message ValidateCustomerResponse {
  // true si existe y está activo.
  bool valido = 1;
  bool activo = 2;
  string mensaje = 3;
}

// Credenciales del cliente.
message AuthenticateCustomerRequest {
  string email = 1;
  string password = 2;
}

// Cliente creado.
message CreateCustomerResponse {
  CustomerData customer = 1;
}

// Cliente actualizado.
message UpdateCustomerResponse {
  CustomerData customer = 1;
}

// Cliente desactivado.
message DeleteCustomerResponse {
  CustomerData customer = 1;
}

// Cliente encontrado.
message GetCustomerByIdResponse {
  CustomerData customer = 1;
}

// Cliente autenticado.
message AuthenticateCustomerResponse {
  CustomerData customer = 1;
}