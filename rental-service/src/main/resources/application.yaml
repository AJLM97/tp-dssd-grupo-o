server:
  port: 8083

grpc:
  server:
    port: 9093

spring:
  application:
    name: rental-service
  datasource:
    url: jdbc:mysql://localhost:3309/rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect